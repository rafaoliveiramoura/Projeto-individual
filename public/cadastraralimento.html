<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymbrothers - Cadastrar alimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app-layout.css">
    <link rel="stylesheet" href="cadastrarex.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="app-container">
            <aside class="app-sidebar">
                <div class="sidebar-logo">
                    <a href="dashboard.html"><img src="img/logo.png" alt="GYMBROTHERS Logo"></a>
                </div>
                <nav class="app-nav">
                    <a href="dashboard.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span>Início</span>
                    </a>
                    <a href="treinos.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h12M4 7v10M20 7v10"></path></svg>
                        <span>Treinos</span>
                    </a>
                    <a href="dieta.html" class="nav-item active" aria-current="page">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 11v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6"></path><line x1="14" y1="15" x2="21" y2="15"></line><line x1="14" y1="18" x2="21" y2="18"></line><line x1="14" y1="21" x2="21" y2="21"></line></svg>
                        <span>Dieta</span>
                    </a>
                    <a href="academias.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span>Academias</span>
                    </a>
                    <a href="perfil.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>Perfil</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <a href="#" class="nav-item" id="btn-logout" onclick="sair(); return false;">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        <span>Sair</span>
                    </a>
                </div>
            </aside>

            <main class="app-content">
                <header class="app-header">
                    <div class="header-titles">
                        <h1>Cadastrar alimento</h1>
                        <p>Monte a sua dieta, refeição por refeição 🍽️</p>
                    </div>
                    <div class="header-actions">
                        <a href="dieta.html" class="link-voltar">&larr; Voltar para Dieta</a>
                        <div class="user-avatar" id="user-avatar" aria-label="Perfil do Usuário">A</div>
                    </div>
                </header>

                <section class="ex-form-wrap">
                    <div class="base-card ex-card">
                        <h2>Novo alimento</h2>
                        <p>Você pode adicionar quantos quiser, um de cada vez.</p>
                        <form id="aliForm" novalidate onsubmit="return salvarAlimento()">
                            <div class="input-group" id="grp_tipo" hidden>
                                <label for="sel_tipo">Objetivo da dieta (opcional)</label>
                                <select id="sel_tipo" class="form-select">
                                    <option value="">Prefiro não informar</option>
                                    <option value="Emagrecimento">Emagrecimento</option>
                                    <option value="Hipertrofia">Hipertrofia</option>
                                    <option value="Manutenção">Manutenção</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="sel_refeicao">Refeição</label>
                                <select id="sel_refeicao" class="form-select">
                                    <option value="">Selecione a refeição</option>
                                    <option>Manhã</option>
                                    <option>Almoço</option>
                                    <option>Lanche</option>
                                    <option>Pré-treino</option>
                                    <option>Pós-treino</option>
                                    <option>Janta</option>
                                    <option>Ceia</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="ipt_alimento">Alimento</label>
                                <input type="text" id="ipt_alimento" maxlength="45" placeholder="Ex.: Arroz" autocomplete="off">
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="ipt_qtd">Quantidade</label>
                                    <input type="number" id="ipt_qtd" min="0" max="9999" step="any" inputmode="decimal" placeholder="150">
                                </div>
                                <div class="input-group">
                                    <label for="sel_unidade">Unidade</label>
                                    <select id="sel_unidade" class="form-select">
                                        <option value="g">g (gramas)</option>
                                        <option value="ml">ml</option>
                                        <option value="unidade">unidade</option>
                                        <option value="fatia">fatia</option>
                                        <option value="copo">copo</option>
                                        <option value="colher">colher</option>
                                        <option value="xícara">xícara</option>
                                        <option value="porção">porção</option>
                                    </select>
                                </div>
                            </div>
                            <p class="form-feedback" id="feedback" role="status" aria-live="polite"></p>
                            <button type="submit" class="register-button" id="btnSalvar">Salvar alimento</button>
                        </form>
                    </div>
                </section>
            </main>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Início</span></a>
            <a href="treinos.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M6 12h12M6 8h12M6 16h12"></path></svg><span>Treinos</span></a>
            <a href="dieta.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"></path></svg><span>Dieta</span></a>
            <a href="academias.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span>Academias</span></a>
            <a href="perfil.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Perfil</span></a>
        </nav>
    </div>

    <script>
        // ===== 1. Quem está logado? =====
        let sessao = JSON.parse(localStorage.getItem('gymbrothers_session'));

        let adicionados = 0;   // quantos alimentos já foram salvos nesta visita

        // ===== 2. Funções =====
        function sair() {
            let certeza = confirm('Deseja realmente sair?');
            if (certeza) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        function mostrar(mensagem, tipo) {
            let feedback = document.getElementById('feedback');
            feedback.textContent = mensagem;
            feedback.className = 'form-feedback ' + tipo;
        }

        function mostrarErroDaResposta(resposta, mensagemPadrao) {
            resposta.text().then(function (texto) {
                texto = texto.replaceAll('"', '').trim();

                if (texto.charAt(0) == '<') {
                    mostrar('O servidor não encontrou essa rota. Confira se o dieta.routes.js está ligado no app.js.', 'erro');
                } else if (texto == '') {
                    mostrar(mensagemPadrao, 'erro');
                } else {
                    mostrar(texto, 'erro');
                }
                document.getElementById('btnSalvar').disabled = false;
            });
        }

        // O "objetivo da dieta" só é perguntado na primeira vez (quando o usuário ainda não tem alimentos)
        function verificarPrimeiraVez() {
            fetch('/users/' + sessao.id + '/alimentos')
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (lista) {
                            if (lista.length > 0) {
                                document.getElementById('grp_tipo').hidden = true;
                            } else {
                                document.getElementById('grp_tipo').hidden = false;
                            }
                        });
                    }
                })
                .catch(function (erro) {
                    console.log('#ERRO: ' + erro);
                });
        }

        // Chamada quando clica em "Salvar alimento" (onsubmit do formulário)
        function salvarAlimento() {
            mostrar('', '');

            let refeicao = document.getElementById('sel_refeicao').value;
            let alimento = document.getElementById('ipt_alimento').value.trim();
            let quantidade = document.getElementById('ipt_qtd').value;
            let unidade = document.getElementById('sel_unidade').value;
            let tipo = '';

            if (document.getElementById('grp_tipo').hidden == false) {
                tipo = document.getElementById('sel_tipo').value;
            }

            if (refeicao == '') {
                mostrar('Escolha a refeição.', 'erro');
                return false;
            }
            if (alimento == '') {
                mostrar('Digite o nome do alimento.', 'erro');
                return false;
            }
            if (quantidade == '' || Number(quantidade) <= 0) {
                mostrar('Informe a quantidade.', 'erro');
                return false;
            }

            // o objeto que vai virar JSON e ser enviado para a API
            let dados = {
                userId: sessao.id,
                refeicao: refeicao,
                alimento: alimento,
                quantidade: Number(quantidade),
                unidade: unidade,
                tipo: tipo
            };

            document.getElementById('btnSalvar').disabled = true;

            fetch('/alimentos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        adicionados = adicionados + 1;
                        document.getElementById('grp_tipo').hidden = true;   // a dieta já foi criada

                        let texto = ' alimentos adicionados';
                        if (adicionados == 1) {
                            texto = ' alimento adicionado';
                        }
                        mostrar('Salvo! ' + adicionados + texto + '. Adicione outro ou volte para a Dieta.', 'ok');

                        // limpa os campos para o próximo (mantém a refeição escolhida)
                        document.getElementById('ipt_alimento').value = '';
                        document.getElementById('ipt_qtd').value = '';
                        document.getElementById('ipt_alimento').focus();
                        document.getElementById('btnSalvar').disabled = false;
                    } else {
                        mostrarErroDaResposta(resposta, 'Erro ao salvar o alimento');
                    }
                })
                .catch(function (erro) {
                    console.log('#ERRO: ' + erro);
                    mostrar('Não foi possível falar com o servidor.', 'erro');
                    document.getElementById('btnSalvar').disabled = false;
                });

            return false;   // false = não recarrega a página
        }

        function iniciar() {
            let nome = sessao.nome;
            if (nome == undefined || nome == '') {
                nome = 'Atleta';
            }
            document.getElementById('user-avatar').textContent = nome.charAt(0).toUpperCase();
            verificarPrimeiraVez();
        }

        // ===== 3. Começo da tela =====
        if (sessao == null) {
            window.location.href = 'login.html';
        } else {
            iniciar();
        }
    </script>
</body>
</html>
