                    </a>
                    <a href="configuracoes.html" class="nav-item">

                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        <span>Sair</span>
                    </a>

            </aside>

            <main class="app-content">
                <header class="app-header">
                    <div class="header-titles">
                        <h1>Cadastrar alimento</h1>
                        <p>Monte a sua dieta, refeição por refeição 🍽️</p>
                    </div>
                    <div class="header-actions">
                        <a href="dieta.html" class="link-voltar">&larr; Voltar para Dieta</a>
                        <div class="user-avatar" id="user-avatar" aria-label="Perfil do Usuário">A</div>
                    </div>
                </header>

                <section class="ex-form-wrap">
                    <div class="base-card ex-card">
                        <h2>Novo alimento</h2>
                        <p>Você pode adicionar quantos quiser, um de cada vez.</p>
                        <form id="aliForm" novalidate>
                            <div class="input-group" id="grp_tipo" hidden>
                                <label for="sel_tipo">Objetivo da dieta (opcional)</label>
                                <select id="sel_tipo" class="form-select">
                                    <option value="">Prefiro não informar</option>
                                    <option value="Emagrecimento">Emagrecimento</option>
                                    <option value="Hipertrofia">Hipertrofia</option>
                                    <option value="Manutenção">Manutenção</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="sel_refeicao">Refeição</label>
                                <select id="sel_refeicao" class="form-select">
                                    <option value="">Selecione a refeição</option>
                                    <option>Manhã</option>
                                    <option>Almoço</option>
                                    <option>Lanche</option>
                                    <option>Pré-treino</option>
                                    <option>Pós-treino</option>
                                    <option>Janta</option>
                                    <option>Ceia</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="ipt_alimento">Alimento</label>
                                <input type="text" id="ipt_alimento" maxlength="45" placeholder="Ex.: Arroz" autocomplete="off">
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="ipt_qtd">Quantidade</label>
                                    <input type="number" id="ipt_qtd" min="0" max="9999" step="any" inputmode="decimal" placeholder="150">
                                </div>
                                <div class="input-group">
                                    <label for="sel_unidade">Unidade</label>
                                    <select id="sel_unidade" class="form-select">
                                        <option value="g">g (gramas)</option>
                                        <option value="ml">ml</option>
                                        <option value="unidade">unidade</option>
                                        <option value="fatia">fatia</option>
                                        <option value="copo">copo</option>
                                        <option value="colher">colher</option>
                                        <option value="xícara">xícara</option>
                                        <option value="porção">porção</option>
                                    </select>
                                </div>
                            </div>
                            <p class="form-feedback" id="feedback" role="status" aria-live="polite"></p>
                            <button type="submit" class="register-button" id="btnSalvar">Salvar alimento</button>
                        </form>
                    </div>
                </section>
            </main>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Início</span></a>
            <a href="treinos.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M6 12h12M6 8h12M6 16h12"></path></svg><span>Treinos</span></a>
            <a href="dieta.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"></path></svg><span>Dieta</span></a>
            <a href="evolucao.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9-3-9h-4"></path></svg><span>Evolução</span></a>
            <a href="perfil.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Perfil</span></a>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Sessão gravada no login
            let sessao = null;
            try { sessao = JSON.parse(localStorage.getItem('gymbrothers_session') || 'null'); } catch (e) { sessao = null; }
            if (!sessao || !sessao.id) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('user-avatar').textContent = (sessao.nome || 'Atleta').charAt(0).toUpperCase();
            document.getElementById('btn-logout').addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('Deseja realmente sair?')) {
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            });

            const feedback = document.getElementById('feedback');
            const btn = document.getElementById('btnSalvar');
            const selRefeicao = document.getElementById('sel_refeicao');
            const iptAlimento = document.getElementById('ipt_alimento');
            const iptQtd = document.getElementById('ipt_qtd');
            const selUnidade = document.getElementById('sel_unidade');
            const selTipo = document.getElementById('sel_tipo');
            const grpTipo = document.getElementById('grp_tipo');
            let adicionados = 0;

            function mostrar(msg, tipo) {
                feedback.textContent = msg;
                feedback.className = 'form-feedback ' + (tipo || '');
            }

            // O servidor responde o motivo em texto (ou como string JSON)
            async function lerErro(resposta, padrao) {
                try {
                    const txt = (await resposta.text()).replace(/^"|"$/g, '').trim();
                    if (txt.charAt(0) === '<') {
                        return resposta.status === 404
                            ? 'O servidor não encontrou essa rota. Confira se o dieta.routes.js está ligado no arquivo principal do servidor.'
                            : padrao;
                    }
                    return txt || padrao;
                } catch (e) { return padrao; }
            }

            // O objetivo da dieta só é perguntado na primeira vez (quando o usuário ainda não tem alimentos)
            fetch('/users/' + sessao.id + '/alimentos')
                .then(r => r.ok ? r.json() : [])
                .then(lista => { grpTipo.hidden = lista.length > 0; })
                .catch(() => { grpTipo.hidden = true; });

            document.getElementById('aliForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                mostrar('');

                const alimento = iptAlimento.value.trim();
                if (!selRefeicao.value) { mostrar('Escolha a refeição.', 'erro'); return; }
                if (!alimento) { mostrar('Digite o nome do alimento.', 'erro'); return; }
                if (iptQtd.value === '' || Number(iptQtd.value) <= 0) { mostrar('Informe a quantidade.', 'erro'); return; }

                btn.disabled = true;
                try {
                    const resposta = await fetch('/alimentos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: sessao.id,
                            refeicao: selRefeicao.value,
                            alimento: alimento,
                            quantidade: Number(iptQtd.value),
                            unidade: selUnidade.value,
                            tipo: grpTipo.hidden ? '' : selTipo.value
                        })
                    });
                    if (!resposta.ok) throw new Error(await lerErro(resposta, 'Erro ao salvar o alimento'));

                    adicionados++;
                    grpTipo.hidden = true; // a dieta já foi criada
                    mostrar('Salvo! ' + adicionados + (adicionados === 1 ? ' alimento adicionado' : ' alimentos adicionados') + '. Adicione outro ou volte para a Dieta.', 'ok');
                    // Mantém a refeição escolhida para adicionar o próximo alimento rápido
                    iptAlimento.value = '';
                    iptQtd.value = '';
                    iptAlimento.focus();
                } catch (erro) {
                    mostrar(erro.message || 'Erro ao salvar o alimento', 'erro');
                } finally {
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
