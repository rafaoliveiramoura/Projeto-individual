            <main class="app-content">

                    </div>
                </header>

                <section class="ac-cards" id="ac-cards" aria-label="Academias que eu já treinei"></section>

                <section class="base-card ex-card ac-mapcard" aria-labelledby="ac-mapa-titulo">
                    <h2 id="ac-mapa-titulo" class="ac-mapa-titulo">Onde ficam</h2>

            <a href="perfil.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Perfil</span></a>
        </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ===== AS MINHAS ACADEMIAS (fixas no site, não vêm do banco) =====
        // Para achar lat/lng: no Google Maps, clique com o botão direito no local e clique nos números que aparecem (copia as coordenadas).
        // nota: de 0 a 5 (pode ser 4.5). foto: arquivo dentro de public/img/ (opcional).
        const ACADEMIAS = [
            {
                nome: 'Academia Golfinhos',
                bairro: 'Av. Arquiteto Vilanova Artigas, 373 · Conj. Hab. Teotônio Vilela, São Paulo',
                lat: -23.6150, lng: -46.4990,   // APROXIMADA: confirme no Google Maps (botão direito no local)
                nota: 3.5,
                descricao: 'Ela é boa para iniciar, mas depois que você evolui a carga, ela não atende mais a necessidade.',
                foto: 'img/golfinhos.jpg'
            },
            {
                nome: 'Smart Fit Sapopemba',
                bairro: 'Av. Sapopemba, 8671 · Jardim Adutora, São Paulo',
                lat: -23.5987, lng: -46.5174,
                nota: 4,
                descricao: 'Ela é muito boa de maquinário, mas é muito lotada.',
                foto: 'img/smartfit.jpg'
            },
            {
                nome: 'Panobianco Carapicuíba',
                bairro: 'Av. Inocêncio Seráfico, 1420 · Vila Silva Ribeiro, Carapicuíba',
                lat: -23.5290, lng: -46.8390,   // APROXIMADA: confirme no Google Maps (botão direito no local)
                nota: 5,
                descricao: 'Maquinário incrível. É a melhor academia que eu já treinei: a recepção é incrível e as pessoas de lá também.',
                foto: 'img/panobiano.jpg'
            }
        ];

        document.addEventListener('DOMContentLoaded', function () {
            const sessao = JSON.parse(localStorage.getItem('gymbrothers_session') || 'null');
            if (!sessao || !sessao.id) { window.location.href = 'login.html'; return; }

            document.getElementById('user-avatar').textContent = (sessao.nome || 'Atleta').charAt(0).toUpperCase();
            document.getElementById('btn-logout').addEventListener('click', function (e) {
                e.preventDefault();
                if (confirm('Deseja realmente sair?')) { localStorage.clear(); window.location.href = 'login.html'; }
            });

            const fmtNota = (n) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };

            function estrelas(nota) {
                const box = el('span', 'ac-stars');
                box.setAttribute('role', 'img');
                box.setAttribute('aria-label', 'Nota ' + fmtNota(nota) + ' de 5');
                const cheio = el('span', 'ac-stars-fill', '★★★★★');
                cheio.style.width = Math.max(0, Math.min(5, nota)) / 5 * 100 + '%';
                box.append(el('span', 'ac-stars-base', '★★★★★'), cheio);
                return box;
            }

            // ---------- Mapa ----------
            const mapa = L.map('mapa', { scrollWheelZoom: false }).setView([-23.5505, -46.6333], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }).addTo(mapa);

            const cartoes = [];
            const marcadores = [];

            function destacar(i) {
                cartoes.forEach((c, k) => c.classList.toggle('ac-card--ativo', k === i));
                marcadores.forEach((m, k) => { const e = m.getElement(); if (e) e.classList.toggle('ac-pin--ativo', k === i); });
            }

            // ---------- Cartões lado a lado ----------
            const area = document.getElementById('ac-cards');
            if (!ACADEMIAS.length) area.appendChild(el('p', 'ex-empty', 'Nenhuma academia cadastrada ainda.'));

            ACADEMIAS.forEach(function (a, i) {
                const card = el('article', 'base-card ac-card');

                const moldura = el('div', 'ac-foto-box');
                if (a.foto) {
                    const img = el('img', 'ac-foto');
                    img.src = a.foto;
                    img.alt = 'Foto da academia ' + a.nome;
                    img.loading = 'lazy';
                    img.addEventListener('error', function () { moldura.classList.add('ac-foto-box--vazia'); img.remove(); });
                    moldura.appendChild(img);
                } else {
                    moldura.classList.add('ac-foto-box--vazia');
                }
                moldura.appendChild(el('span', 'ac-num', String(i + 1)));
                card.appendChild(moldura);

                const corpo = el('div', 'ac-corpo');
                corpo.appendChild(el('h2', 'ac-nome', a.nome));
                if (a.bairro) corpo.appendChild(el('p', 'ac-bairro', a.bairro));

                corpo.appendChild(el('p', 'ac-rotulo', 'Minha avaliação'));
                const linha = el('div', 'ac-nota');
                linha.appendChild(estrelas(a.nota));
                linha.appendChild(el('strong', null, fmtNota(a.nota) + ' / 5'));
                corpo.appendChild(linha);

                corpo.appendChild(el('p', 'ac-rotulo', 'O que eu achei'));
                corpo.appendChild(el('p', 'ac-desc', a.descricao));

                const btn = el('button', 'ac-btn-mapa', 'Ver no mapa');
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    document.getElementById('mapa').scrollIntoView({ behavior: 'smooth', block: 'center' });
                    mapa.flyTo([a.lat, a.lng], 15, { duration: .8 });
                    destacar(i);
                });
                corpo.appendChild(btn);

                card.appendChild(corpo);
                area.appendChild(card);
                cartoes.push(card);

                // pino numerado no mapa; clicar nele destaca o cartão
                const icon = L.divIcon({ className: 'ac-pin', html: '<span><b>' + (i + 1) + '</b></span>', iconSize: [34, 34], iconAnchor: [17, 34] });
                const m = L.marker([a.lat, a.lng], { icon: icon, title: a.nome, alt: a.nome }).addTo(mapa);
                m.on('click', function () {
                    destacar(i);
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
                marcadores.push(m);
            });

            if (ACADEMIAS.length > 1) {
                mapa.fitBounds(L.latLngBounds(ACADEMIAS.map(a => [a.lat, a.lng])), { padding: [40, 40], maxZoom: 15 });
            } else if (ACADEMIAS.length === 1) {
                mapa.setView([ACADEMIAS[0].lat, ACADEMIAS[0].lng], 14);
            }

            setTimeout(function () { mapa.invalidateSize(); }, 150);
            window.addEventListener('resize', function () { mapa.invalidateSize(); });
            // rolar a página não dá zoom sem querer: ativa só depois de clicar no mapa
            mapa.on('click', function () { mapa.scrollWheelZoom.enable(); });
            mapa.on('mouseout', function () { mapa.scrollWheelZoom.disable(); });
        });
    </script>
</body>
</html>
