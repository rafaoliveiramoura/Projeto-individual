    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ===== AS MINHAS ACADEMIAS (fixas no site, não vêm do banco) =====
        // Para achar lat/lng: no Google Maps, clique com o botão direito no local e clique nos números que aparecem (copia as coordenadas).
        // nota: de 0 a 5 (pode ser 4.5). foto: arquivo dentro de public/img/academias/ (opcional).
        const ACADEMIAS = [
            {
                nome: '[EXEMPLO] Academia 1 - troque pelos seus dados',
                bairro: 'Consolação, São Paulo',
                lat: -23.5558, lng: -46.6624,
                nota: 4.5,
                periodo: 'Treinei aqui de 2023 a 2024',
                descricao: 'Escreva aqui o que você achou: estrutura, equipamentos, limpeza, lotação, preço, atendimento.',
                foto: 'img/academias/academia1.jpg'
            },
            {
                nome: '[EXEMPLO] Academia 2 - troque pelos seus dados',
                bairro: 'Pinheiros, São Paulo',
                lat: -23.5672, lng: -46.6931,
                nota: 3,
                periodo: 'Treinei aqui por 3 meses',
                descricao: 'Escreva aqui a sua avaliação honesta, com pontos bons e ruins.',
                foto: 'img/academias/academia2.jpg'
            }
        ];

        document.addEventListener('DOMContentLoaded', function () {
            const sessao = JSON.parse(localStorage.getItem('gymbrothers_session') || 'null');
            if (!sessao || !sessao.id) { window.location.href = 'login.html'; return; }

            document.getElementById('user-avatar').textContent = (sessao.nome || 'Atleta').charAt(0).toUpperCase();
            document.getElementById('btn-logout').addEventListener('click', function (e) {
                e.preventDefault();
                if (confirm('Deseja realmente sair?')) { localStorage.clear(); window.location.href = 'login.html'; }
            });

            const fmtNota = (n) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };

            function estrelas(nota) {
                const box = el('span', 'ac-stars');
                box.setAttribute('role', 'img');
                box.setAttribute('aria-label', 'Nota ' + fmtNota(nota) + ' de 5');
                const base = el('span', 'ac-stars-base', '★★★★★');
                const cheio = el('span', 'ac-stars-fill', '★★★★★');
                cheio.style.width = Math.max(0, Math.min(5, nota)) / 5 * 100 + '%';
                box.appendChild(base); box.appendChild(cheio);
                return box;
            }

            const mapa = L.map('mapa', { scrollWheelZoom: false }).setView([-23.5505, -46.6333], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }).addTo(mapa);

            const marcadores = [];
            const itens = [];
            const detalhe = document.getElementById('detalhe');
            const lista = document.getElementById('lista-ac');

            function mostrar(i, moverMapa) {
                const a = ACADEMIAS[i];
                const card = el('div', 'ac-card');
                if (a.foto) {
                    const img = el('img', 'ac-foto');
                    img.src = a.foto;
                    img.alt = 'Foto da academia ' + a.nome;
                    img.loading = 'lazy';
                    img.addEventListener('error', function () { img.remove(); });
                    card.appendChild(img);
                }
                card.appendChild(el('h2', 'ac-nome', a.nome));
                if (a.bairro) card.appendChild(el('p', 'ac-bairro', a.bairro));
                const linha = el('div', 'ac-nota');
                linha.appendChild(estrelas(a.nota));
                linha.appendChild(el('strong', null, fmtNota(a.nota) + ' / 5'));
                card.appendChild(linha);
                if (a.periodo) card.appendChild(el('p', 'ac-periodo', a.periodo));
                card.appendChild(el('p', 'ac-desc', a.descricao));
                detalhe.replaceChildren(card);

                marcadores.forEach((m, k) => m.getElement() && m.getElement().classList.toggle('ac-pin--ativo', k === i));
                itens.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
                if (moverMapa) mapa.flyTo([a.lat, a.lng], Math.max(mapa.getZoom(), 14), { duration: .6 });
            }

            if (!ACADEMIAS.length) {
                detalhe.replaceChildren(el('p', 'ex-empty', 'Nenhuma academia cadastrada ainda.'));
            }

            ACADEMIAS.forEach(function (a, i) {
                const icon = L.divIcon({ className: 'ac-pin', html: '<span><b>' + (i + 1) + '</b></span>', iconSize: [34, 34], iconAnchor: [17, 34] });
                const m = L.marker([a.lat, a.lng], { icon: icon, title: a.nome, alt: a.nome }).addTo(mapa);
                m.on('click', function () { mostrar(i, false); });
                marcadores.push(m);

                const li = el('li');
                const b = el('button', 'ex-item ac-item');
                b.type = 'button';
                const esq = el('div');
                esq.appendChild(el('div', 'ex-name', (i + 1) + '. ' + a.nome));
                if (a.bairro) esq.appendChild(el('div', 'ex-meta', a.bairro));
                b.appendChild(esq);
                b.appendChild(el('div', 'ex-load', '★ ' + fmtNota(a.nota)));
                b.addEventListener('click', function () { mostrar(i, true); });
                li.appendChild(b); lista.appendChild(li); itens.push(b);
            });

            if (ACADEMIAS.length > 1) {
                mapa.fitBounds(L.latLngBounds(ACADEMIAS.map(a => [a.lat, a.lng])), { padding: [40, 40], maxZoom: 15 });
            } else if (ACADEMIAS.length === 1) {
                mapa.setView([ACADEMIAS[0].lat, ACADEMIAS[0].lng], 14);
            }
            if (ACADEMIAS.length) mostrar(0, false);

            // o mapa só ganha tamanho depois do layout
            setTimeout(function () { mapa.invalidateSize(); }, 150);
            window.addEventListener('resize', function () { mapa.invalidateSize(); });
            // rolagem da página não deve dar zoom sem querer: ativa só depois de clicar no mapa
            mapa.on('click', function () { mapa.scrollWheelZoom.enable(); });
            mapa.on('mouseout', function () { mapa.scrollWheelZoom.disable(); });
        });
