                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

            <main class="app-content">
                <header class="app-header">
                    <div class="header-titles">
                        <h1>Academias</h1>
                        <p>As academias que eu já treinei, com a minha avaliação e o que achei de cada uma.</p>
                    </div>
                    <div class="header-actions">
                        <div class="user-avatar" id="user-avatar" aria-label="Perfil do Usuário">A</div>
                    </div>
                </header>

                <section class="ac-cards" id="ac-cards" aria-label="Academias que eu já treinei"></section>

                <section class="base-card ex-card ac-mapcard" aria-labelledby="ac-mapa-titulo">
                    <h2 id="ac-mapa-titulo" class="ac-mapa-titulo">Onde ficam</h2>
                    <div id="mapa" role="region" aria-label="Mapa das academias"></div>
                </section>
            </main>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Início</span></a>
            <a href="treinos.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M6 12h12M6 8h12M6 16h12"></path></svg><span>Treinos</span></a>
            <a href="dieta.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"></path></svg><span>Dieta</span></a>
            <a href="academias.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span>Academias</span></a>
            <a href="perfil.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Perfil</span></a>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ===== 1. Quem está logado? =====
        let sessao = JSON.parse(localStorage.getItem('gymbrothers_session'));

        // ===== 2. As minhas academias (fixas no site, não vêm do banco) =====
        // É um VETOR de OBJETOS. Cada objeto é uma academia.
        // Para achar lat/lng: no Google Maps, clique com o botão direito no local e clique nos números que aparecem.
        // nota: de 0 a 5 (pode ser 4.5). foto: arquivo dentro de public/img/
        let ACADEMIAS = [
            {
                nome: 'Academia Golfinhos',
                bairro: 'Av. Arquiteto Vilanova Artigas, 373 · Conj. Hab. Teotônio Vilela, São Paulo',
                lat: -23.6150,
                lng: -46.4990,   // APROXIMADA: confirme no Google Maps (botão direito no local)
                nota: 3.5,
                descricao: 'Ela é boa para iniciar, mas depois que você evolui a carga, ela não atende mais a necessidade.',
                foto: 'img/golfinhos.jpg'
            },
            {
                nome: 'Smart Fit Sapopemba',
                bairro: 'Av. Sapopemba, 8671 · Jardim Adutora, São Paulo',
                lat: -23.5987,
                lng: -46.5174,
                nota: 4,
                descricao: 'Ela é muito boa de maquinário, mas é muito lotada.',
                foto: 'img/smartfit.jpg'
            },
            {
                nome: 'Panobianco Carapicuíba',
                bairro: 'Av. Inocêncio Seráfico, 1420 · Vila Silva Ribeiro, Carapicuíba',
                lat: -23.5290,
                lng: -46.8390,   // APROXIMADA: confirme no Google Maps (botão direito no local)
                nota: 5,
                descricao: 'Maquinário incrível. É a melhor academia que eu já treinei: a recepção é incrível e as pessoas de lá também.',
                foto: 'img/panobiano.jpg'
            }
        ];

        let mapa = null;   // o mapa do Leaflet (criado em iniciar)

        // ===== 3. Funções =====
        function sair() {
            let certeza = confirm('Deseja realmente sair?');
            if (certeza) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // Cria um elemento (tag) com uma classe e um texto
        function criarElemento(tag, classe, texto) {
            let elemento = document.createElement(tag);
            elemento.className = classe;
            if (texto != undefined) {
                elemento.textContent = texto;
            }
            return elemento;
        }

        // 3.5 vira "3,5"
        function formatarNota(nota) {
            return Number(nota).toFixed(1).replace('.', ',');
        }

        // Cinco estrelas cinzas com cinco estrelas amarelas por cima.
        // A largura das amarelas é a nota dividida por 5 (ex.: 3,5 de 5 = 70%).
        function criarEstrelas(nota) {
            let caixa = criarElemento('span', 'ac-stars');
            caixa.setAttribute('role', 'img');
            caixa.setAttribute('aria-label', 'Nota ' + formatarNota(nota) + ' de 5');

            let cinza = criarElemento('span', 'ac-stars-base', '★★★★★');
            let amarela = criarElemento('span', 'ac-stars-fill', '★★★★★');
            amarela.style.width = (nota / 5) * 100 + '%';

            caixa.appendChild(cinza);
            caixa.appendChild(amarela);
            return caixa;
        }

        // Botão "Ver no mapa": centraliza o mapa na academia de posição i do vetor
        function verNoMapa(i) {
            let academia = ACADEMIAS[i];
            document.getElementById('mapa').scrollIntoView();
            mapa.setView([academia.lat, academia.lng], 15);
        }

        // Monta o cartão de UMA academia (recebe o objeto e a posição dele no vetor)
        function criarCartao(academia, i) {
            let cartao = criarElemento('article', 'base-card ac-card');

            // foto + número
            let moldura = criarElemento('div', 'ac-foto-box');
            let foto = criarElemento('img', 'ac-foto');
            foto.src = academia.foto;
            foto.alt = 'Foto da academia ' + academia.nome;
            // se a foto não for encontrada, tira a imagem quebrada
            foto.onerror = function () {
                moldura.classList.add('ac-foto-box--vazia');
                foto.remove();
            };
            moldura.appendChild(foto);
            moldura.appendChild(criarElemento('span', 'ac-num', String(i + 1)));
            cartao.appendChild(moldura);

            // texto
            let corpo = criarElemento('div', 'ac-corpo');
            corpo.appendChild(criarElemento('h2', 'ac-nome', academia.nome));
            corpo.appendChild(criarElemento('p', 'ac-bairro', academia.bairro));

            corpo.appendChild(criarElemento('p', 'ac-rotulo', 'Minha avaliação'));
            let linhaNota = criarElemento('div', 'ac-nota');
            linhaNota.appendChild(criarEstrelas(academia.nota));
            linhaNota.appendChild(criarElemento('strong', '', formatarNota(academia.nota) + ' / 5'));
            corpo.appendChild(linhaNota);

            corpo.appendChild(criarElemento('p', 'ac-rotulo', 'O que eu achei'));
            corpo.appendChild(criarElemento('p', 'ac-desc', academia.descricao));

            let botao = criarElemento('button', 'ac-btn-mapa', 'Ver no mapa');
            botao.type = 'button';
            botao.setAttribute('onclick', 'verNoMapa(' + i + ')');
            corpo.appendChild(botao);

            cartao.appendChild(corpo);
            return cartao;
        }

        function iniciar() {
            let nome = sessao.nome;
            if (nome == undefined || nome == '') {
                nome = 'Atleta';
            }
            document.getElementById('user-avatar').textContent = nome.charAt(0).toUpperCase();

            // cria o mapa (Leaflet) e coloca o fundo do mapa (tiles)
            mapa = L.map('mapa', { scrollWheelZoom: false }).setView([-23.5505, -46.6333], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(mapa);

            let area = document.getElementById('ac-cards');
            let pontos = [];   // vetor com as coordenadas, para enquadrar o mapa

            // um for passa por todas as academias: cria o cartão e o pino no mapa
            for (let i = 0; i < ACADEMIAS.length; i++) {
                let academia = ACADEMIAS[i];

                area.appendChild(criarCartao(academia, i));

                let icone = L.divIcon({
                    className: 'ac-pin',
                    html: '<span><b>' + (i + 1) + '</b></span>',
                    iconSize: [34, 34],
                    iconAnchor: [17, 34]
                });
                let pino = L.marker([academia.lat, academia.lng], { icon: icone, title: academia.nome });
                pino.addTo(mapa);
                pino.bindPopup(academia.nome);

                pontos.push([academia.lat, academia.lng]);
            }

            // enquadra o mapa para mostrar todas as academias de uma vez
            mapa.fitBounds(pontos, { padding: [40, 40], maxZoom: 15 });
        }

        // ===== 4. Começo da tela =====
        if (sessao == null) {
            window.location.href = 'login.html';
        } else {
            iniciar();
        }
    </script>
</body>
