<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app-layout.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="app-container">
            <aside class="app-sidebar">
                <div class="sidebar-logo">
                    <a href="dashboard.html"><img src="img/logo.png" alt="GYMBROTHERS Logo"></a>

                <nav class="app-nav">

                    </a>
                    <a href="treinos.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h12M4 7v10M20 7v10"></path></svg>
                        <span>Treinos</span>
                    </a>
                    <a href="dieta.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 11v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6"></path><line x1="14" y1="15" x2="21" y2="15"></line><line x1="14" y1="18" x2="21" y2="18"></line><line x1="14" y1="21" x2="21" y2="21"></line></svg>
                        <span>Dieta</span>
                    </a>
                    <a href="evolucao.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-6"></path></svg></svg>
                        <span>Evolução</span>
                    </a>
                    <a href="perfil.html" class="nav-item active" aria-current="page">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>Perfil</span>
                    </a>
                    <a href="configuracoes.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.64 9l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        <span>Configurações</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <a href="#" class="nav-item" id="btn-logout">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        <span>Sair</span>
                    </a>
                </div>
            </aside>
            <main class="app-content">
                <header class="app-header">
                    <div class="header-titles">
                        <h1 id="page-title">Meu Perfil</h1>
                        <p>Seus dados e objetivos</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn-icon" aria-label="Notificações"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></button>
                        <div class="user-avatar" id="user-avatar">A</div>
                    </div>
                </header>
                <section class="base-card" style="max-width: 600px;">
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-card-border);">
                            <span style="color: var(--color-text-muted);">Peso Atual</span>
                            <span id="prof-weight" style="font-weight: 700;">-- kg</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-card-border);">
                            <span style="color: var(--color-text-muted);">Altura</span>
                            <span id="prof-height" style="font-weight: 700;">-- cm</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-card-border);">
                            <span style="color: var(--color-text-muted);">Peso Meta</span>
                            <span id="prof-goal" style="font-weight: 700;">-- kg</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-card-border);">
                            <span style="color: var(--color-text-muted);">Experiência</span>
                            <span id="prof-exp" style="font-weight: 700;">--</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-card-border);">
                            <span style="color: var(--color-text-muted);">Frequência</span>
                            <span id="prof-freq" style="font-weight: 700;">--</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px 0;">
                            <span style="color: var(--color-text-muted);">Foco</span>
                            <span id="prof-focus" style="font-weight: 700;">--</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Início</span></a>
            <a href="treinos.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M6 12h12M6 8h12M6 16h12"></path></svg><span>Treinos</span></a>
            <a href="dieta.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"></path></svg><span>Dieta</span></a>
            <a href="evolucao.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9-3-9h-4"></path></svg><span>Evolução</span></a>
            <a href="perfil.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Perfil</span></a>
        </nav>
    </div>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('gymbrothers_user_data') || '{}');
            document.getElementById('prof-weight').textContent = (userData.weightCurrent || '--') + ' kg';
            document.getElementById('prof-height').textContent = (userData.height || '--') + ' cm';
            document.getElementById('prof-goal').textContent = (userData.weightGoal || '--') + ' kg';
            document.getElementById('prof-exp').textContent = userData.experience || '--';
            document.getElementById('prof-freq').textContent = userData.frequency || '--';
            document.getElementById('prof-focus').textContent = userData.focus || '--';
        });
    </script>
</body>
</html>
