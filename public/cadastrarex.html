            <main class="app-content">
                <header class="app-header">
                    <div class="header-titles">
                        <h1>Cadastrar exercício</h1>
                        <p>Registre a carga, as séries e as repetições do seu treino 💪</p>
                    </div>
                    <div class="header-actions">
                        <a href="treinos.html" class="link-voltar">&larr; Voltar para Treinos</a>
                        <div class="user-avatar" id="user-avatar" aria-label="Perfil do Usuário">A</div>
                    </div>
                </header>

                <section class="ex-form-wrap">
                    <div class="base-card ex-card">
                        <h2>Novo registro</h2>
                        <p>A data é registrada automaticamente.</p>
                        <form id="exForm" novalidate>
                            <div class="input-group">
                                <label for="sel_ex">Exercício</label>
                                <select id="sel_ex" class="form-select">
                                    <option value="">Carregando...</option>
                                </select>
                            </div>
                            <div class="input-group" id="grp_novo" hidden>
                                <label for="ipt_novo">Nome do novo exercício</label>
                                <input type="text" id="ipt_novo" maxlength="100" placeholder="Ex.: Remada curvada" autocomplete="off">
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="ipt_carga">Carga (kg)</label>
                                    <input type="number" id="ipt_carga" min="0" max="999" step="0.5" inputmode="decimal" placeholder="60">
                                </div>
                                <div class="input-group">
                                    <label for="ipt_series">Séries</label>
                                    <input type="number" id="ipt_series" min="1" max="20" step="1" inputmode="numeric" placeholder="4">
                                </div>
                            </div>
                            <div class="input-group">
                                <label for="ipt_repeticoes">Repetições por série</label>
                                <input type="number" id="ipt_repeticoes" min="1" max="100" step="1" inputmode="numeric" placeholder="10">
                            </div>
                            <p class="form-feedback" id="feedback" role="status" aria-live="polite"></p>
                            <button type="submit" class="register-button" id="btnSalvar">Salvar exercício</button>
                        </form>
                    </div>
                </section>
            </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Sessão gravada no login (cada endereço do navegador tem a sua; veja a observação sobre localhost)
            let sessao = null;
            try { sessao = JSON.parse(localStorage.getItem('gymbrothers_session') || 'null'); } catch (e) { sessao = null; }
            if (!sessao || !sessao.id) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('user-avatar').textContent = (sessao.nome || 'Atleta').charAt(0).toUpperCase();
            document.getElementById('btn-logout').addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('Deseja realmente sair?')) {
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            });

            const sel = document.getElementById('sel_ex');
            const grpNovo = document.getElementById('grp_novo');
            const iptNovo = document.getElementById('ipt_novo');
            const feedback = document.getElementById('feedback');
            const btn = document.getElementById('btnSalvar');
            const NOVO = '__novo__';

            function mostrar(msg, tipo) {
                feedback.textContent = msg;
                feedback.className = 'form-feedback ' + (tipo || '');
            }

            // O servidor responde o motivo em texto (ou como string JSON)
            async function lerErro(resposta, padrao) {
                try {
                    const txt = (await resposta.text()).replace(/^"|"$/g, '').trim();
                    // Página de erro do Express (HTML): a rota não existe no servidor
                    if (txt.charAt(0) === '<') {
                        return resposta.status === 404
                            ? 'O servidor não encontrou essa rota. Confira se o ex.routes.js está ligado no arquivo principal do servidor.'
                            : padrao;
                    }
                    return txt || padrao;
                } catch (e) { return padrao; }
            }

            function montarOpcoes(lista) {
                sel.replaceChildren();
                const add = (valor, texto) => {
                    const o = document.createElement('option');
                    o.value = valor; o.textContent = texto; sel.appendChild(o);
                };
                add('', 'Selecione um exercício');
                lista.forEach(ex => add(String(ex.idexercicio), ex.nome));
                add(NOVO, '+ Outro exercício (criar novo)');
            }

            fetch('/exercicios')
                .then(r => { if (!r.ok) throw new Error('Erro ao buscar exercícios'); return r.json(); })
                .then(montarOpcoes)
                .catch(erro => {
                    console.log('#ERRO: ' + erro);
                    montarOpcoes([]);
                    mostrar('Não foi possível carregar a lista. Você ainda pode criar um exercício novo.', 'erro');
                });

            sel.addEventListener('change', () => {
                const novo = sel.value === NOVO;
                grpNovo.hidden = !novo;
                if (novo) iptNovo.focus();
            });

            // Cria o nome (se for novo) e devolve o id do exercício
            async function obterIdExercicio() {
                if (sel.value !== NOVO) return Number(sel.value);
                const resposta = await fetch('/exercicios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: iptNovo.value.trim() })
                });
                if (!resposta.ok) throw new Error(await lerErro(resposta, 'Erro ao criar o exercício'));
                return (await resposta.json()).id;
            }

            document.getElementById('exForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                mostrar('');

                const carga = document.getElementById('ipt_carga').value;
                const series = document.getElementById('ipt_series').value;
                const repeticoes = document.getElementById('ipt_repeticoes').value;

                if (!sel.value) { mostrar('Escolha um exercício.', 'erro'); return; }
                if (sel.value === NOVO && !iptNovo.value.trim()) { mostrar('Digite o nome do novo exercício.', 'erro'); return; }
                if (carga === '' || series === '' || repeticoes === '') { mostrar('Preencha carga, séries e repetições.', 'erro'); return; }

                btn.disabled = true;
                try {
                    const exercicioId = await obterIdExercicio();
                    const resposta = await fetch('/registros', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: sessao.id,
                            fkexercicio: exercicioId,
                            carga: Number(carga),
                            series: Number(series),
                            repeticoes: Number(repeticoes)
                        })
                    });
                    if (!resposta.ok) throw new Error(await lerErro(resposta, 'Erro ao salvar o exercício'));

                    mostrar('Exercício salvo! Voltando para Treinos...', 'ok');
                    setTimeout(() => { window.location.href = 'treinos.html'; }, 900);
                } catch (erro) {
                    mostrar(erro.message || 'Erro ao salvar o exercício', 'erro');
                    btn.disabled = false;
                }
            });
        });
    </script>
