<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymbrothers - Cadastrar exercício</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app-layout.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="cadastrarex.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="app-container">
            <aside class="app-sidebar">
                <div class="sidebar-logo">
                    <a href="dashboard.html">
                        <img src="img/logo.png" alt="GYMBROTHERS Logo">
                    </a>
                </div>
                <nav class="app-nav">
                    <a href="dashboard.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span>Início</span>
                    </a>
                    <a href="treinos.html" class="nav-item active" aria-current="page">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h12M4 7v10M20 7v10"></path></svg>
                        <span>Treinos</span>
                    </a>
                    <a href="dieta.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 11v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6"></path><line x1="14" y1="15" x2="21" y2="15"></line><line x1="14" y1="18" x2="21" y2="18"></line><line x1="14" y1="21" x2="21" y2="21"></line></svg>
                        <span>Dieta</span>
                    </a>
                    <a href="academias.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span>Academias</span>
                    </a>
                    <a href="perfil.html" class="nav-item">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>Perfil</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <a href="#" class="nav-item" id="btn-logout" onclick="sair(); return false;">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        <span>Sair</span>
                    </a>
                </div>
            </aside>

            <main class="app-content">
                <header class="app-header">
                    <div class="header-titles">
                        <h1>Cadastrar exercício</h1>
                        <p>Registre a carga, as séries e as repetições do seu treino 💪</p>
                    </div>
                    <div class="header-actions">
                        <a href="treinos.html" class="link-voltar">&larr; Voltar para Treinos</a>
                        <div class="user-avatar" id="user-avatar" aria-label="Perfil do Usuário">A</div>
                    </div>
                </header>

                <section class="ex-form-wrap">
                    <div class="base-card ex-card">
                        <h2>Novo registro</h2>
                        <p>A data é registrada automaticamente.</p>
                        <form id="exForm" novalidate onsubmit="return salvar()">
                            <div class="input-group">
                                <label for="sel_ex">Exercício</label>
                                <select id="sel_ex" class="form-select" onchange="trocarExercicio()">
                                    <option value="">Carregando...</option>
                                </select>
                            </div>
                            <div class="input-group" id="grp_novo" hidden>
                                <label for="ipt_novo">Nome do novo exercício</label>
                                <input type="text" id="ipt_novo" maxlength="100" placeholder="Ex.: Remada curvada" autocomplete="off">
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="ipt_carga">Carga (kg)</label>
                                    <input type="number" id="ipt_carga" min="0" max="999" step="0.5" inputmode="decimal" placeholder="60">
                                </div>
                                <div class="input-group">
                                    <label for="ipt_series">Séries</label>
                                    <input type="number" id="ipt_series" min="1" max="20" step="1" inputmode="numeric" placeholder="4">
                                </div>
                            </div>
                            <div class="input-group">
                                <label for="ipt_repeticoes">Repetições por série</label>
                                <input type="number" id="ipt_repeticoes" min="1" max="100" step="1" inputmode="numeric" placeholder="10">
                            </div>
                            <p class="form-feedback" id="feedback" role="status" aria-live="polite"></p>
                            <button type="submit" class="register-button" id="btnSalvar">Salvar exercício</button>
                        </form>
                    </div>
                </section>
            </main>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Início</span>
            </a>
            <a href="treinos.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M6 12h12M6 8h12M6 16h12"></path></svg>
                <span>Treinos</span>
            </a>
            <a href="dieta.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"></path></svg>
                <span>Dieta</span>
            </a>
            <a href="academias.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span>Academias</span></a>
            <a href="perfil.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

    <script>
        // ===== 1. Quem está logado? =====
        let sessao = JSON.parse(localStorage.getItem('gymbrothers_session'));

        // ===== 2. Funções =====
        function sair() {
            let certeza = confirm('Deseja realmente sair?');
            if (certeza) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // Mostra uma mensagem embaixo do formulário. tipo: 'ok', 'erro' ou '' (limpar)
        function mostrar(mensagem, tipo) {
            let feedback = document.getElementById('feedback');
            feedback.textContent = mensagem;
            feedback.className = 'form-feedback ' + tipo;
        }

        // Quando a API responde com erro, lê o texto do erro e mostra na tela
        function mostrarErroDaResposta(resposta, mensagemPadrao) {
            resposta.text().then(function (texto) {
                texto = texto.replaceAll('"', '').trim();

                if (texto.charAt(0) == '<') {
                    // veio uma página de erro do Express: a rota não existe
                    mostrar('O servidor não encontrou essa rota. Confira se o ex.routes.js está ligado no app.js.', 'erro');
                } else if (texto == '') {
                    mostrar(mensagemPadrao, 'erro');
                } else {
                    mostrar(texto, 'erro');
                }
                document.getElementById('btnSalvar').disabled = false;
            });
        }

        function mostrarErroDeConexao(erro) {
            console.log('#ERRO: ' + erro);
            mostrar('Não foi possível falar com o servidor.', 'erro');
            document.getElementById('btnSalvar').disabled = false;
        }

        function adicionarOpcao(valor, texto) {
            let opcao = document.createElement('option');
            opcao.value = valor;
            opcao.textContent = texto;
            document.getElementById('sel_ex').appendChild(opcao);
        }

        // Preenche o <select> com os exercícios que vieram da API (um for no vetor)
        function montarOpcoes(lista) {
            document.getElementById('sel_ex').textContent = '';
            adicionarOpcao('', 'Selecione um exercício');
            for (let i = 0; i < lista.length; i++) {
                adicionarOpcao(String(lista[i].idexercicio), lista[i].nome);
            }
            adicionarOpcao('novo', '+ Outro exercício (criar novo)');
        }

        function carregarExercicios() {
            fetch('/exercicios')
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(montarOpcoes);
                    } else {
                        montarOpcoes([]);
                        mostrar('Não foi possível carregar a lista. Você ainda pode criar um exercício novo.', 'erro');
                    }
                })
                .catch(function (erro) {
                    console.log('#ERRO: ' + erro);
                    montarOpcoes([]);
                    mostrar('Não foi possível carregar a lista. Você ainda pode criar um exercício novo.', 'erro');
                });
        }

        // Chamada quando muda a opção do <select>: mostra o campo "nome do novo exercício" só se escolheu "novo"
        function trocarExercicio() {
            let escolha = document.getElementById('sel_ex').value;
            if (escolha == 'novo') {
                document.getElementById('grp_novo').hidden = false;
                document.getElementById('ipt_novo').focus();
            } else {
                document.getElementById('grp_novo').hidden = true;
            }
        }

        // Manda o registro (carga, séries e repetições) para a API
        function salvarRegistro(idExercicio) {
            let registro = {
                userId: sessao.id,
                fkexercicio: idExercicio,
                carga: Number(document.getElementById('ipt_carga').value),
                series: Number(document.getElementById('ipt_series').value),
                repeticoes: Number(document.getElementById('ipt_repeticoes').value)
            };

            fetch('/registros', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registro)
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        mostrar('Exercício salvo! Voltando para Treinos...', 'ok');
                        setTimeout(function () {
                            window.location.href = 'treinos.html';
                        }, 900);
                    } else {
                        mostrarErroDaResposta(resposta, 'Erro ao salvar o exercício');
                    }
                })
                .catch(mostrarErroDeConexao);
        }

        // Se o exercício é novo: cria primeiro, pega o id que a API devolve e só depois salva o registro
        function criarExercicioESalvar() {
            let novo = { nome: document.getElementById('ipt_novo').value.trim() };

            fetch('/exercicios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novo)
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (dados) {
                            salvarRegistro(dados.id);
                        });
                    } else {
                        mostrarErroDaResposta(resposta, 'Erro ao criar o exercício');
                    }
                })
                .catch(mostrarErroDeConexao);
        }

        // Chamada quando clica em "Salvar exercício" (onsubmit do formulário)
        function salvar() {
            mostrar('', '');

            let escolha = document.getElementById('sel_ex').value;
            let nomeNovo = document.getElementById('ipt_novo').value.trim();
            let carga = document.getElementById('ipt_carga').value;
            let series = document.getElementById('ipt_series').value;
            let repeticoes = document.getElementById('ipt_repeticoes').value;

            if (escolha == '') {
                mostrar('Escolha um exercício.', 'erro');
                return false;
            }
            if (escolha == 'novo' && nomeNovo == '') {
                mostrar('Digite o nome do novo exercício.', 'erro');
                return false;
            }
            if (carga == '' || series == '' || repeticoes == '') {
                mostrar('Preencha carga, séries e repetições.', 'erro');
                return false;
            }

            document.getElementById('btnSalvar').disabled = true;

            if (escolha == 'novo') {
                criarExercicioESalvar();
            } else {
                salvarRegistro(Number(escolha));
            }
            return false;   // false = não recarrega a página
        }

        function iniciar() {
            let nome = sessao.nome;
            if (nome == undefined || nome == '') {
                nome = 'Atleta';
            }
            document.getElementById('user-avatar').textContent = nome.charAt(0).toUpperCase();
            carregarExercicios();
        }

        // ===== 3. Começo da tela =====
        if (sessao == null) {
            window.location.href = 'login.html';
        } else {
            iniciar();
        }
    </script>
</body>
</html>
